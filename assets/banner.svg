<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#111A33"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C6EF5"/>
      <stop offset="100%" stop-color="#63E6BE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <path d="M 90 230 L 300 195 L 470 205 L 640 150 L 820 165 L 1000 95 L 1130 60"
        fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.4s" fill="freeze"/>
  </path>

  <g opacity="0">
    <circle cx="90" cy="230" r="5" fill="#4C6EF5"/>
    <circle cx="470" cy="205" r="5" fill="#4C6EF5"/>
    <circle cx="820" cy="165" r="5" fill="#4C6EF5"/>
    <circle cx="1130" cy="60" r="7" fill="#63E6BE"/>
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>
  </g>

  <circle cx="1130" cy="60" r="7" fill="none" stroke="#63E6BE" stroke-width="2" opacity="0">
    <animate attributeName="r" values="7;14;7" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="90" y="110" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F4F6FB" letter-spacing="2">SAGOR</text>
  <text x="92" y="145" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8FA0C7" letter-spacing="1">NOT HERE TO FOLLOW. HERE TO BUILD.</text>
</svg>
